name: Deploy to Dev

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test
          rm -f build/libs/*-plain.jar
          mv build/libs/*SNAPSHOT.jar ./project.jar

      - name: Copy Files to EC2 (JAR, Config, Script)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "project.jar, docker-compose.yml, deploy.sh"
          target: "/home/ubuntu/app"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            rm -f .env
            echo "DEV_DB_USERNAME=${{ secrets.DEV_DB_USERNAME }}" >> .env
            echo "DEV_DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}" >> .env
            docker compose up -d
            chmod +x deploy.sh
            ./deploy.sh