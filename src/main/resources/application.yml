spring:
  application:
    name: yeobaek
  profiles:
    active: local
    include: secret
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # Flyway가 DDL 담당 -> validate나 none으로 둬야 함
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
logging:
  level:
    root: info
    com.nova.yeobaek: info
app:
  cookie:
    http-only: true
    secure: true
    same-site: none
